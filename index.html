<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#07070c" />
    <meta name="description" content="Pixel Collector — récolte des pixels. Ton score n'est à toi qu'une fois déposé au vault." />
    <title>PIXEL COLLECTOR</title>

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" />
    <!-- iOS ignores the manifest: it needs its own tags to install to the home screen. -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pixel Collector" />

    <!-- Open Graph: the link needs to look like a game when it lands in a group chat. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PIXEL COLLECTOR" />
    <meta property="og:description" content="Récolte des pixels. Ton score n'est à toi qu'une fois déposé au vault." />
    <meta property="og:image" content="./icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app">
      <canvas id="stage"></canvas>
      <div id="ui"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // Relative path on purpose: the game is also served from a subdirectory
      // (GitHub Pages project sites), where '/sw.js' would 404.
      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {
            /* offline support is a bonus, never a requirement to play */
          })
        })
      }
    </script>
  </body>
</html>
