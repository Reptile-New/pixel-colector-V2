name: Déployer sur GitHub Pages

# Uniquement depuis la branche par défaut : l'environnement `github-pages`
# n'autorise qu'elle, un déclenchement sur une branche de travail échouerait
# systématiquement et polluerait l'historique des exécutions.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul déploiement à la fois ; on ne coupe pas celui qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Le typecheck fait partie de `npm run build` : un déploiement ne part
      # jamais avec du TypeScript cassé.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
